name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (por ejemplo 1.0.0.0). Vacío = la de Directory.Build.props'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if (-not $version -and '${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }

          [xml]$props = Get-Content -Path ./Directory.Build.props
          $propsVersion = @($props.Project.PropertyGroup)[0].Version
          if (-not $version) { $version = $propsVersion }

          if ($version -ne $propsVersion) {
            throw "La versión '$version' no coincide con Directory.Build.props ($propsVersion)."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and test
        run: dotnet test --configuration Release --nologo --verbosity minimal

      - name: Package
        shell: pwsh
        run: ./package.ps1 -Configuration Release -Version '${{ steps.version.outputs.version }}'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: threecat-zip
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: threecat-zip
          path: dist

      - name: Update manifest
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/Update-Manifest.ps1 `
            -Version '${{ needs.build.outputs.version }}' `
            -Changelog '3Cat ${{ needs.build.outputs.version }}'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: 3Cat ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.event.repository.default_branch }}
          fail_on_unmatched_files: true
          files: dist/*.zip
          body: |
            Paquete del plugin **3Cat** para Jellyfin 10.11.

            Instalación:
            1. Añade el repositorio de plugins:
               `https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/manifest.json`
            2. En **Panel de control → Plugins → Catálogo** instala o actualiza **3Cat**.
            3. Alternativa manual: copia el contenido de `threecat_${{ needs.build.outputs.version }}.zip`
               en `plugins/3Cat_${{ needs.build.outputs.version }}/` y reinicia Jellyfin.

      - name: Commit manifest
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if git diff --cached --quiet; then
            echo 'El manifiesto ya estaba actualizado.'
          else
            git commit -m "manifest: 3Cat ${{ needs.build.outputs.version }}"
            git push
          fi
