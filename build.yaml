targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Crea una biblioteca de series con el catálogo a la carta de 3Cat (.strm + metadatos + subtítulos)."
description: >
  Resuelve el catálogo público de 3Cat (TV3, SX3, 33, Esport3) y lo replica como biblioteca de
  series de Jellyfin mediante archivos .strm, con metadatos .nfo, carátulas y subtítulos SRT
  convertidos desde los WebVTT originales. La actualización se ejecuta con una tarea programada y
  desde la propia página de configuración del plugin.
category: "General"
# Repositorio propio del plugin (repositorio de plugins autoalojado).
owner: "Lowitle"
artifacts:
  - "Jellyfin.Plugin.ThreeCat.dll"
changelog: >
  1.2.0.0: cada serie se clasifica por el formato bajo el que 3Cat archiva el programa («Sèrie»,
  «Documental», «Animació», «Cinema», «Concurs»...), que se escribe como primer género del tvshow.nfo
  por delante de sus temas, así que la biblioteca se filtra por tipo de programa con los filtros
  nativos de Jellyfin y sin plugins añadidos. La página de configuración estrena la casilla
  «Clasificar los programas por su formato» (activada por defecto; desactivada, los géneros vuelven a
  ser solo los temas de los vídeos) y la tabla del catálogo añade la columna «Categoría», con filtro por
  categoría, búsqueda por texto y ordenación. 3Cat no publica esa clasificación en ningún endpoint: el
  plugin barre las facetas format_contingut y tematica del buscador (24 peticiones, cacheadas media
  hora) y las invierte en una tabla por programatv_id. Si el barrido falla, la serie se escribe con sus
  temas como hasta ahora, nunca sin géneros.
  1.1.0.0: «Ver todos los programas» abre el catálogo completo de 3Cat en una tabla con búsqueda por
  texto y filtros por tipo, canal, solo con vídeos y ya añadidos, columnas ordenables (nombre, id,
  tipo, canal, idiomas, edad y fecha de publicación), selección de las filas visibles y paginación de
  200 en 200; el catálogo sale del buscador público de 3Cat (2201 programas en cinco peticiones de 500,
  con caché de diez minutos), los programas web y de radio se listan marcados y sin casilla porque su
  catálogo de vídeos responde 404. Los subtítulos se descargan siempre en todos los idiomas que
  publique cada vídeo, así que desaparecen las casillas de idioma y la opción «todos los idiomas».
  1.0.0.0: primera versión. Sincroniza programas de 3Cat por programatv_id o por la URL de
  cualquiera de sus vídeos, escribe un .strm por emisión con la URL del MP4 progresivo, un .nfo
  con el título, la temporada, el capítulo y la descripción, carátula de la serie, miniatura del
  episodio y subtítulos en catalán convertidos de WebVTT a SRT. Usa el campo capitol de 3Cat como
  número de episodio (su numeración no coincide con TVDB, así que los metadatos online deben
  dejarse desactivados para esa biblioteca), omite los vídeos caducados y avisa cuando el catálogo
  no devuelve URL reproducible por geobloqueo o despublicación.
