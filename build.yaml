changelog: >
  1.9.0.0: la biblioteca deja de ser una carpeta plana. Hasta ahora todos los programas caían directamente en la
  carpeta de destino, así que Jellyfin solo podía tener una biblioteca y las películas de 3Cat se escribían como una
  serie de un episodio. Con la casilla «Organizar los programas por tipo» —activada en una instalación nueva y
  desactivada al migrar una configuración anterior, porque mover la biblioteca de alguien no puede ser un efecto
  secundario de una actualización— cada programa se escribe en la subcarpeta de su tipo: «Programes TV» para
  informativos, magacines, concursos, humor, música, teatro y deporte; «Series» para la ficción; «Documentals»;
  «Anime»; «Infantil» para lo que 3Cat marca con el público del SX3; y «Movies» para el cine. El tipo sale de la
  misma clasificación que ya escribe el primer género, con el anime por delante del público y las películas por
  delante de todo, así que no hay ninguna tabla que mantener aparte. «Crear biblioteca» pasa a preparar dos
  bibliotecas —una de «Programas de TV» con las cinco carpetas de las series y una de «Películas» con «Movies»—,
  crea las carpetas que falten, las añade a la biblioteca que ya se llame «3Cat» y retira de ella la carpeta madre
  que indexaba antes, que con la estructura nueva ya no es una carpeta de series. Como Jellyfin indexa una carpeta
  en todas las bibliotecas que apuntan a ella, una biblioteca curada («Anime», «Infantil»…) puede apuntar a una
  sola subcarpeta sin duplicar un solo archivo: la copia espejo por programa sigue existiendo para lo que de verdad
  es otra copia (otro disco, otra biblioteca de otro nombre). El cine deja de escribirse como una serie: cada
  título que publica el programa es una película en su carpeta «Título (Año)», con su <c>movie.nfo</c>, su carátula
  y sus subtítulos, y las partes en que 3Cat emite una película se escriben como versiones de la misma película
  («- part1», «- part2»), que es lo único que Jellyfin sabe leer. El <c>movie.nfo</c> no lleva ningún id de
  proveedor a propósito: el dataset de identificadores resuelve los de las series, y el id de televisión de TMDB en
  una película haría que Jellyfin trajese la ficha de otra obra. Las películas caducadas o renombradas se retiran
  con su carpeta, y solo cuando la carpeta es de este programa. La primera actualización después de activar la
  casilla mueve cada programa a su carpeta y borra la anterior —solo si es del plugin para ese programa—, así que
  Jellyfin vuelve a leer las series una vez y se pierde el estado «visto» de esa pasada; desactivar la casilla deja
  los archivos donde están.
  1.8.3.0: los vídeos que 3Cat fecha fuera de orden dejan de quedarse sin episodio. El emparejamiento recorre las
  dos listas hacia adelante y no vuelve atrás, así que un capítulo que 3Cat publica con una fecha posterior a la del
  siguiente —el 40 de «El detectiu Conan» llega después del 41, y el 53 después del 79— pasaba de largo el episodio
  que le tocaba y se quedaba sin él aunque siguiera libre; el hueco lo rellenaba después la pasada del orden, que
  reparte por descarte los episodios que sobran, y le daba uno que no era el suyo. Ahora, después de alinear por el
  «capitol» con el desfase leído de los títulos y antes de repartir por orden, una pasada de rescate empareja cada
  vídeo que se quedó sin episodio con el libre más cercano a la posición que anuncia su contador, con dos posiciones
  de margen, sin reclamar nunca un episodio ya escrito y sin tocar las segundas partes, que se resuelven como el
  «part2» del episodio de su primera parte. Medido sobre el catálogo real de «El detectiu Conan»: los vídeos del
  informe que se quedan sin episodio bajan de 36 a 29, el capítulo 40 se coloca en «El caso de la heredera asesinada
  (1)» y el 41 en el (2), y el 53 y el 54, que 3Cat fecha al final de la temporada, vuelven a «El caso del Monstruo
  de la Niebla», el 54 como segunda parte.
  1.8.2.0: el contador de 3Cat deja de ir desfasado cuando el catálogo emite un episodio en varias partes. El
  «capitol» cuenta emisiones de 3Cat, no episodios del original: en «El detectiu Conan», 183 de sus 385 vídeos son
  la primera o la segunda mitad de algo, y TMDB numera muchos de esos episodios una sola vez, así que desde el
  primer corte cada vídeo iba un episodio por delante y el error se acumulaba hasta 57 capítulos al final del
  catálogo (una cobertura del 85 % que estaba mal puesta). Ahora los títulos de los dos catálogos, escritos en
  catalán y en castellano, se comparan palabra a palabra dándole más peso a la palabra rara que a la que sale en
  cien títulos, y cada vídeo cuyo título se parece al de un episodio vota cuántas posiciones está desfasado el
  contador; los vecinos descartan la coincidencia suelta y el escalón se dibuja donde 3Cat partió el episodio. Con
  ese desfase aplicado, las dos listas se alinean en vez de consultarse, y los vídeos que son la segunda o tercera
  parte de un episodio que el proveedor numera una sola vez se escriben como «part1» y «part2» del mismo episodio,
  que es como los publicó 3Cat y como Jellyfin los reproduce en orden. Si los títulos no dicen nada, el contador se
  usa igual que antes. Medido sobre el catálogo real de «El detectiu Conan»: 15 votos ya sitúan el primer escalón
  en el capítulo 12, donde el informe de cobertura lo señalaba a mano.
  1.8.1.1: la pasada del «capitol» deja de mirar el orden en que llegan los vídeos, que es justo lo que la
  dejaba fuera. La 1.8.1.0 pedía que el contador creciera con el orden de emisión, y resulta que 3Cat fecha su
  catálogo con la emisión del doblaje y lo fecha mal: en «El detectiu Conan» el capítulo 40 va fechado después
  del 41 y el 53 después del 79, cinco saltos atrás en 385 vídeos, así que la guarda rechazaba el contador y la
  serie se quedaba en el 0 % de cobertura. Ahora se comprueba que el contador numere cada vídeo una sola vez (un
  índice de temporada repite los números que ya ha dado) y que ninguna emisión vuelva al principio del programa,
  que es lo que es una reemisión y no una fecha unos días fuera de sitio. Medido sobre el catálogo real de «El
  detectiu Conan»: 329 de 385 vídeos emparejados por el contador (85,5 %) con cero desviaciones, en cualquier
  orden en que lleguen los vídeos. La vista previa, además, dice por qué no se ha usado el contador cuando no se
  usa: si el proveedor lista menos de la mitad de los capítulos que 3Cat anuncia, o si los números se repiten.
  1.8.1.0: el «capitol» de 3Cat pasa de pista a evidencia y el emparejamiento deja de necesitar anclas. Ese
  contador numera el programa entero y no la temporada: «El detectiu Conan» va del 1 al 1.206 sin un solo paso
  atrás (T1 acaba en 43 y T2 empieza en 44, T3 en 89 y, tras los 720 capítulos que 3Cat no aloja, T20 empieza
  en 857), así que el vídeo es el episodio que ocupa esa posición en la lista absoluta de TMDB. Antes el
  emparejamiento contaba vídeos en vez de leer números y, con los huecos del catálogo, numeraba el capítulo 857
  como el 136; además el relleno de las anclas se detenía en cada cambio de temporada y solo alcanzaba la
  temporada del ancla. Ahora hay una pasada propia que respeta los huecos, el orden de publicación de los
  capítulos y los programas que solo publican una parte del catálogo, y que se desactiva sola cuando el
  contador no es del programa (si reinicia en cada tanda o si va hacia atrás por una reemisión). Medido sobre
  el catálogo real de «El detectiu Conan»: 329 de 385 vídeos emparejados (85,5 %) con cero desviaciones frente
  al 0 % de la 1.8.0.0 sin anclas, y el 100 % si TMDB lista los 1.206 capítulos. Las anclas siguen ahí, pero
  ahora solo sirven para calibrar el desfase entre los dos contadores con una sola línea. La vista previa
  añade el contador «capitol» al resumen, marca cada vídeo con la evidencia «capitol» y avisa del desfase
  cuando las anclas lo fijan.
  1.8.0.0: el emparejamiento deja de creerse las fechas que no son suyas y estrena anclas. 3Cat publica la
  fecha de su propia emisión, así que en una serie doblada años después de estrenarse la fecha de cada vídeo
  no tiene nada que ver con la del episodio: «Detectiu Conan» se emitió en TV3 a cinco capítulos por semana
  desde 2001 mientras Japón lo emitía a uno por semana desde 1996, y por eso cada cinco vídeos las dos fechas
  volvían a coincidir —46 de 385, todas falsas, y el resto a la temporada 0—. Ahora la fecha solo cuenta si
  al menos la mitad de los vídeos con fecha caen en el día (o el día antes o después) de un episodio de TMDB;
  si no, se descarta entera y la vista previa lo explica. Para los casos que ninguna fecha ni ningún título
  puede resolver están las anclas, que se escriben con la numeración de los propios títulos de 3Cat y se
  guardan por programa: «T1=1» (la temporada 1 de 3Cat empieza en el episodio 1 de TMDB), «T20=857»,
  «T22xC6=906» o «T1xC1=S01E01», separadas por «;». El plugin coloca todas las anclas primero y después numera
  el resto de cada temporada caminando la lista de TMDB hacia arriba y hacia abajo, parando en la temporada
  siguiente o en el episodio que otra ancla ya ha reclamado; con doce anclas, «Detectiu Conan» pasa del 0 % de
  cobertura al 85 % y se renumera con TMDB. La vista previa lista las temporadas de 3Cat con su rango de
  «capitol» para escribir las anclas sin abrir el catálogo, marca cada vídeo con su contador en una columna
  nueva, dice cuántas anclas se han podido colocar y avisa cuando las fechas se han descartado. El «capitol»
  se publica en el 100 % de los programas (43 de 44 en una muestra de 60 de todos los formatos), mientras que
  «capitol_temporada» falta en la mitad, así que la temporada sigue leyéndose del título.
  1.7.1.1: la vista previa del emparejamiento vuelve a enseñar la tabla. La página leía las respuestas del
  plugin en minúscula inicial («message», «title», «rows») y el servidor las publica en mayúscula
  («Message», «Title», «Rows»), así que probar una serie solo contestaba «undefined:», sin tabla, sin
  contadores y sin el motivo. Ahora lee los campos con el mismo ayudante que el resto de la página, la
  cobertura se calcula como fracción (antes siempre decía «Cobertura: 0 %») y un test nuevo vigila que
  ningún campo del servidor se lea sin ese ayudante.
  1.7.1.0: la vista previa del emparejamiento acepta el programa escrito como sea: el «programatv_id», la
  URL de su página («https://www.3cat.cat/3cat/detectiu-conan/»), su «slug», su título («El detectiu
  Conan») o el id de cualquiera de sus vídeos, y estrena un segundo campo para el id de TMDB —o la URL de
  su ficha— que manda sobre el del dataset y sobre el de la tabla de programas. Antes solo entendía el id
  de un programa o la URL de un vídeo, y un id o una URL de TMDB se leían como un programa de 3Cat que no
  existía: 3Cat respondía 404 y la vista previa se quedaba sin tabla ni explicación. Ahora la referencia
  se resuelve contra el catálogo de programas que la página ya tiene en memoria —el buscador de 3Cat
  publica el «slug» de cada programa junto a su id, así que la URL y el título no cuestan ninguna petición
  extra—, la respuesta es siempre una tabla con su mensaje, también cuando no hay nada que emparejar, y la
  página enseña los contadores del emparejamiento (vídeos, emparejados por fecha, por título y por orden,
  temporada 0, duplicados y cobertura) para saber si una serie se renumeraría con TMDB o se quedaría con
  3Cat. Si la referencia encaja con varios programas («Conan» es «El detectiu Conan» y «Conan, el nen del
  futur»), la página los ofrece para elegir uno con un clic en vez de fallar, y el mensaje dice qué falta
  cuando falta algo: el id de TMDB, la clave de la API o la respuesta de TMDB. Corrige además un fallo del
  enlace de la fuente: un programa sin catálogo de vídeos ya no deja la vista previa en blanco.
  1.7.0.0: la numeración de los episodios deja de ser la única posible. Cada programa puede numerarse
  con el catálogo de 3Cat (lo de siempre, sigue siendo el valor por defecto) o con TMDB, y con TMDB el
  plugin empareja cada vídeo con su episodio por fecha de emisión y por título —la fecha manda, el título
  desempata y, entre dos parejas ya emparejadas, el orden decide cuando hay el mismo número de vídeos que
  de episodios— y escribe la temporada y el episodio de TMDB en el nombre del fichero, en el «.nfo» y en
  la carpeta «Season NN», que es lo que hace que Jellyfin case la ficha online de cada episodio. El
  emparejamiento es conservador: si no llega a la mitad de los vídeos, o si falta el id del dataset, la
  clave o la respuesta de TMDB, la serie entera se queda con la numeración de 3Cat y lo dice en el
  registro, con el desglose de cuántos episodios se emparejaron por fecha, por título y por orden y
  cuántos cayeron a la temporada 0. La página de configuración estrena el selector global y por programa,
  el campo de la clave de TMDB (v3 o token v4, nunca se escribe en el registro) y una vista previa de la
  tabla «vídeo de 3Cat ↔ episodio de TMDB» que no escribe ningún fichero, para comprobar una serie antes
  de renumerarla. Cambiar la fuente de un programa reescribe su carpeta —solo si es del plugin y su
  «tvshow.nfo» nombra ese programa— porque Jellyfin reimporta esos episodios y se pierde el «visto» de esa
  serie. La numeración de TVDB y el modo de numeración absoluta llegan en la próxima versión: la opción
  aparece deshabilitada y, si se selecciona, la serie se queda en la numeración de 3Cat.
  1.6.0.0: el plugin aprende a identificar cada programa con el dataset abierto «open-tv-ids», que
  traduce el «programatv_id» de 3Cat al id de la misma obra en Wikidata, IMDb, TMDB y TVDB. La tarea
  descarga el dataset (un JSONL de ~180 KB), lo guarda en la carpeta de datos del plugin y, si la
  descarga falla, sigue con la copia anterior; la página de configuración muestra cuántas identidades
  hay, desde cuándo y cuántos de los programas configurados tienen id de TMDB, TVDB e IMDb, con un
  botón para actualizar el dataset a mano y un campo para cambiar la URL (para un fork o una copia
  local). La configuración sube a la versión 3 y estrena la fuente de metadatos —global y por
  programa, con id manual como reserva para lo que el dataset no resuelve—, y el «tvshow.nfo» ya sabe
  escribir los «uniqueid» de tmdb y tvdb. Con la fuente por defecto, la de esta versión, el
  «tvshow.nfo» es exactamente el de 1.5.0.0: no se renombra ni se reescribe ninguna serie. La
  numeración de los episodios sigue siendo la de 3Cat; el emparejamiento con la numeración del
  proveedor y su selector en la página llegan en la próxima versión.
  1.5.0.0: los episodios se numeran con la temporada y el capítulo que 3Cat escribe en el título
  («T22xC6 - Visita als inferns» → temporada 22, capítulo 6), que es la numeración que muestra su web.
  El plugin usaba el campo «capitol» como capítulo, pero es un contador que corre por todo el programa
  (el capítulo 6 de la temporada 22 llega como 907), y el campo «capitol_temporada» es el capítulo
  dentro de la temporada, no la temporada: «El detectiu Conan» acababa con un solo episodio por
  temporada y «Polònia» o «Crackòvia» se quedaban en la temporada 1. Ahora «Polònia» entra con las
  temporadas 1 a 22 (879 emisiones), «Crackòvia» con la 2 a la 10 y «Conan» con la 1 a la 30. Las
  emisiones que 3Cat no numera —especiales, «Gran Reserva», revetlles, resums de temporada— van a la
  temporada 0 con la fecha de emisión delante del título («2026-10-27 - Especial confinament»), así
  que se ordenan como se emitieron y no se pierde ninguna; los programas que no numeran nada (los
  diarios tipo «Tarda oberta») se quedan en la temporada 1 en orden de emisión; los vídeos repetidos
  literalmente se descartan y, si dos emisiones distintas comparten numeración, la segunda pasa a la
  temporada 0. El título del episodio pierde el prefijo de la numeración, así que el fichero queda
  limpio («El detectiu Conan - S22E06 - Visita als inferns», sin «T22xC6 - »). Como cambian los
  nombres, la primera actualización reescribe la biblioteca: si la carpeta de una serie mezcla los
  nombres viejos y los nuevos, borra esa carpeta y vuelve a lanzar «Actualizar 3Cat». La serie se
  escribe siempre en la carpeta de destino del plugin (la biblioteca «3Cat») y la columna
  «Biblioteca» de la lista de programas, ahora «También en», ya no mueve la serie: guarda una copia
  en la carpeta de otra biblioteca de Jellyfin, así que «Anime» o «Infantil» siguen viendo sus
  programas sin quedarse con los ficheros del plugin. La copia son los mismos ficheros ligeros
  (.strm, .nfo, subtítulos y carátulas), por lo que cada biblioteca lleva su propio estado «visto»
  y quitar la carpeta de la columna borra solo la copia. Además, el desplegable de la lista de
  programas ya se puede leer en el tema oscuro: tenía el fondo transparente y el navegador lo
  pintaba blanco con el texto claro encima.
  1.4.1.0: los vídeos vuelven a entrar en el catálogo. 3Cat publica el público y el canal de cada
  vídeo («targets» y «canals») como una lista suelta, y el plugin los esperaba envueltos en un objeto:
  la lectura de cada vídeo fallaba, el programa se quedaba sin emisiones y, sin episodios, no había ni
  series ni anime ni bibliotecas que asignar. Ahora se aceptan las dos formas, la lista que devuelve
  api.3cat.cat y el objeto de las respuestas antiguas, así que el público («Infantil», «Juvenil»,
  «Tots els Públics») y el canal vuelven a clasificar cada programa; el barrido completo del catálogo
  deja 1123 programas con vídeos y 29 marcados como anime, con «El detectiu Conan» (385), «Bola de
  Drac Z» (291) o «One piece» (229) en la biblioteca de anime.
  1.4.0.0: cada programa se puede mandar a la biblioteca de Jellyfin que se quiera. La lista de programas
  estrena la columna «Biblioteca»: por defecto todos se siguen escribiendo en la carpeta de destino del
  plugin, pero un programa se puede asignar a la carpeta de una biblioteca existente («Anime»,
  «Infantil», «Programas de TV»...) y el plugin escribe allí el .strm, el .nfo y los subtítulos, sin
  duplicar nada y sin crear bibliotecas nuevas. Un programa que cambia de biblioteca se borra de la
  carpeta anterior en la siguiente actualización, solo cuando esa carpeta contiene únicamente archivos
  del plugin y su tvshow.nfo identifica el programa; una carpeta que ya no existe o no admite escritura
  no rompe la tarea, el programa vuelve a la carpeta de destino y se avisa en el registro. Además, 3Cat
  clasifica cada vídeo por público («Infantil», «Juvenil», «Tots els Públics»), así que la nueva casilla
  «Marcar los programas infantiles como «Infantil»», activada por defecto, escribe «Infantil» como
  género justo detrás del tipo, con el canal de la familia SX3 como respaldo y sin peticiones extra: la
  biblioteca se filtra por «Infantil» sin perder «Anime» ni «Animació», y la tabla del catálogo los marca
  en la columna «Categoría» y estrena el filtro «Infantil».
  1.3.0.0: el anime se separa de la animación. 3Cat no publica ninguna etiqueta de anime y archiva
  «Bola de Drac» o «Doraemon» bajo el mismo formato que «Mironins» o «Louie», así que el plugin lo
  deduce de la ficha del programa —el país de origen («Japó») y las colecciones internas con las que
  3Cat monta sus franjas de anime—, sin bases de datos externas ni clave de TVDB. Las series de anime
  se escriben con «Anime» como primer género y «Animació» como segundo, así que la biblioteca se filtra
  por anime sin perder el filtro de animación, y la tabla del catálogo las marca con la categoría
  «Anime». De la misma ficha se escribe el título original («Dragon Ball» en «Bola de Drac»). La ficha
  se lee solo para los 175 programas de animación del catálogo (seis peticiones a la vez, unos dos
  segundos, en caché seis horas) y la página estrena la casilla «Separar el anime de la animación»,
  activada por defecto y que requiere la clasificación por formato.
  1.2.0.0: cada serie se clasifica por el formato bajo el que 3Cat archiva el programa («Sèrie»,
  «Documental», «Animació», «Cinema», «Concurs»...), que se escribe como primer género del tvshow.nfo
  por delante de sus temas, así que la biblioteca se filtra por tipo de programa con los filtros
  nativos de Jellyfin y sin plugins añadidos. La página de configuración estrena la casilla
  «Clasificar los programas por su formato» (activada por defecto; desactivada, los géneros vuelven a
  ser solo los temas de los vídeos) y la tabla del catálogo añade la columna «Categoría», con filtro por
  categoría, búsqueda por texto y ordenación. 3Cat no publica esa clasificación en ningún endpoint: el
  plugin barre las facetas format_contingut y tematica del buscador (24 peticiones, cacheadas media
  hora) y las invierte en una tabla por programatv_id. Si el barrido falla, la serie se escribe con sus
  temas como hasta ahora, nunca sin géneros.
  1.1.0.0: «Ver todos los programas» abre el catálogo completo de 3Cat en una tabla con búsqueda por
  texto y filtros por tipo, canal, solo con vídeos y ya añadidos, columnas ordenables (nombre, id,
  tipo, canal, idiomas, edad y fecha de publicación), selección de las filas visibles y paginación de
  200 en 200; el catálogo sale del buscador público de 3Cat (2201 programas en cinco peticiones de 500,
  con caché de diez minutos), los programas web y de radio se listan marcados y sin casilla porque su
  catálogo de vídeos responde 404. Los subtítulos se descargan siempre en todos los idiomas que
  publique cada vídeo, así que desaparecen las casillas de idioma y la opción «todos los idiomas».
  1.0.0.0: primera versión. Sincroniza programas de 3Cat por programatv_id o por la URL de
  cualquiera de sus vídeos, escribe un .strm por emisión con la URL del MP4 progresivo, un .nfo
  con el título, la temporada, el capítulo y la descripción, carátula de la serie, miniatura del
  episodio y subtítulos en catalán convertidos de WebVTT a SRT. Usa el campo capitol de 3Cat como
  número de episodio (su numeración no coincide con TVDB, así que los metadatos online deben
  dejarse desactivados para esa biblioteca), omite los vídeos caducados y avisa cuando el catálogo
  no devuelve URL reproducible por geobloqueo o despublicación.
